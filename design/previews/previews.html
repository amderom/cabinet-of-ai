<!doctype html>
<!--
  The final link-preview images (Phase 1.2 part 3). Lagado: direction C, chosen by the author on 2026-11-13. Llull: the same layout (2026-11-13).
  Each .card is exactly 1200 × 627 and is captured on its own with playwright-cli.
  Fonts come from Astro's font cache: run `npm run dev` or `npm run build` once first.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Link-preview images</title>
<style>
  @font-face { font-family: "Instrument Serif"; src: url("../../.astro/fonts/font-instrument-serif-400-normal-latin-8338166cbdee82ea.woff2"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("../../.astro/fonts/font-instrument-serif-400-italic-latin-ca7f8112fd1d5abd.woff2"); }
  @font-face { font-family: "Inter Tight"; font-weight: 100 900; src: url("../../.astro/fonts/font-inter-tight-100-900-normal-latin-b9ceed8bde206631.woff2"); }
  @font-face { font-family: "IBM Plex Mono"; src: url("../../.astro/fonts/font-ibm-plex-mono-400-normal-latin-8aa90dcd7e8296da.woff2"); }

  :root {
    --ink: #070605; --cream: #f4ecdf; --plate: #efe4cf; --muted: #9a9184; --accent: #ff5f1f;
    --serif: "Instrument Serif", serif; --sans: "Inter Tight", sans-serif; --mono: "IBM Plex Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #222; padding: 40px; display: grid; gap: 40px; justify-content: start; }
  .card { width: 1200px; height: 627px; position: relative; overflow: hidden; background: var(--ink); color: var(--cream); }
  .label { font-family: var(--mono); font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .label b { color: var(--accent); font-weight: 400; }

  /* Lagado: the author's drawing of Swift on its plate */
  #lagado .glow { position: absolute; right: -60px; top: 20px; width: 700px; height: 600px; background: radial-gradient(closest-side, rgb(255 95 31 / 0.30), transparent); }
  #lagado .plate {
    position: absolute; right: 70px; top: 50%; width: 400px; height: 520px; translate: 0 -50%; rotate: 4deg;
    background: var(--plate); display: grid; place-items: center; box-shadow: 0 30px 80px rgb(0 0 0 / 0.6); border-radius: 18px; overflow: hidden;
  }
  #lagado .plate img { height: 470px; mix-blend-mode: multiply; }
  #lagado .text { position: absolute; left: 64px; width: 660px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  #lagado .title { font-family: var(--serif); font-size: 96px; line-height: 0.95; }
  #lagado .title i { color: var(--accent); }
  #lagado .line { font-family: var(--sans); font-size: 32px; line-height: 1.3; }

  /* Llull: the author's drawing of Llull on its plate (same layout as Lagado, Llull's pink) */
  #llull { --accent: #ff2d55; }
  #llull .glow { position: absolute; right: -60px; top: 20px; width: 700px; height: 600px; background: radial-gradient(closest-side, rgb(255 45 85 / 0.30), transparent); }
  #llull .plate {
    position: absolute; right: 70px; top: 50%; width: 470px; height: 520px; translate: 0 -50%; rotate: 4deg;
    background: var(--plate); display: grid; place-items: center; box-shadow: 0 30px 80px rgb(0 0 0 / 0.6); border-radius: 18px; overflow: hidden;
  }
  #llull .plate img { height: 450px; mix-blend-mode: multiply; }
  #llull .text { position: absolute; left: 64px; width: 600px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  #llull .title { font-family: var(--serif); font-size: 96px; line-height: 0.95; }
  #llull .title i { color: var(--accent); }
  #llull .line { font-family: var(--sans); font-size: 32px; line-height: 1.3; }
  #llull .label b { color: var(--accent); }

  /* Site: the cabinet's plates, Lagado open, the next two sealed */
  #site .glow { position: absolute; right: -40px; top: 10px; width: 760px; height: 620px; background: radial-gradient(closest-side, rgb(255 95 31 / 0.22), transparent); }
  #site .text { position: absolute; left: 64px; width: 600px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  #site .title { font-family: var(--serif); font-size: 104px; line-height: 0.92; }
  #site .title i { color: var(--accent); }
  #site .line { font-family: var(--sans); font-size: 32px; line-height: 1.3; }
  #site .p { position: absolute; top: 50%; width: 300px; height: 400px; translate: 0 -50%; border-radius: 16px; overflow: hidden; box-shadow: 0 30px 80px rgb(0 0 0 / 0.65); }
  #site .sealed { background: #14110e; border: 1px solid var(--c); display: grid; place-items: center; }
  #site .s1 { right: 70px; rotate: 9deg; --c: #00e0ff; }
  #site .s2 { right: 160px; rotate: 1deg; --c: #ff2d55; }
  #site .open { right: 250px; rotate: -6deg; background: var(--plate); display: grid; place-items: center; }
  #site .open img { height: 360px; mix-blend-mode: multiply; }
</style>
</head>
<body>

<section class="card" id="lagado">
  <div class="glow"></div>
  <div class="plate"><img src="../../src/demos/lagado/plates/swift-ink.png" alt="" /></div>
  <div class="text">
    <p class="label">Cabinet of AI · <b>Exhibit 01</b></p>
    <p class="title">The Lagado <i>Engine</i></p>
    <p class="line">Write any book. No genius. No study.<br />Just turn the cranks.</p>
  </div>
</section>

<section class="card" id="llull">
  <div class="glow"></div>
  <div class="plate"><img src="../../src/content/exhibits/llull/images/llull-portrait-ink.png" alt="" /></div>
  <div class="text">
    <p class="label">Cabinet of AI · <b>Exhibit 02</b></p>
    <p class="title">Llull’s Ars <i>Magna</i></p>
    <p class="line">Ask anything.<br />Get the one true answer.</p>
  </div>
</section>

<section class="card" id="site">
  <div class="glow"></div>
  <div class="p sealed s1"></div>
  <div class="p sealed s2"></div>
  <div class="p open"><img src="../../src/demos/lagado/plates/swift-ink.png" alt="" /></div>
  <div class="text">
    <p class="label">A cabinet of curiosities</p>
    <p class="title">Cabinet <i>of AI</i></p>
    <p class="line">The ideas behind AI are centuries old.<br />Play with them.</p>
  </div>
</section>

</body>
</html>
