title: The Lagado Engine
tagline: Write any book. No genius. No study. Just turn the cranks.
# The demo page's link-preview description (LinkedIn warns under 100 characters). Approved 2026-11-13.
description: "Write any book. No genius. No study. Just turn the cranks. Swift’s word machine of 1726, rebuilt so you can play with it."
accent: "#FF5F1F"
status: open
order: 1
# Gulliver's Travels, first edition (Benjamin Motte, London, 1726).
year: "1726"
# Every image is declared once here and placed elsewhere by its id (ADR 005).
# Sources and licences: docs/features/lagado/engravings.md
credits:
  - id: swift-portrait
    on: [demo]
    file: ./images/swift-portrait.jpg
    alt: "Ink drawing of Jonathan Swift in a long curled wig and clerical bands, half his face in deep shadow."
    asset: "Jonathan Swift, ink drawing"
    author: "Amélie Derome"
    source: "The author"
    licence: "All rights reserved"
  - id: the-engine
    on: [demo, essay, original, making-of]
    file: ./images/the-engine.png
    alt: "Diagram of the Lagado engine: a square frame of word-blocks with crank handles all around its edges."
    asset: "The Engine, from Gulliver's Travels, Part III"
    source: "Wikimedia Commons"
    url: "https://commons.wikimedia.org/wiki/File:The_Engine_(Gulliver).png"
    licence: "Public domain"
  - id: grandville-scholar
    on: [essay]
    file: ./images/grandville-scholar.jpg
    alt: "Engraving of a stern, balding scholar holding open a huge book covered in scribbled words, dated 1838."
    asset: "A professor and his book, Voyages de Gulliver (1838)"
    author: "J. J. Grandville"
    source: "Source gallica.bnf.fr / BnF"
    url: "https://gallica.bnf.fr/ark:/12148/btv1b86002890/f77.item"
    licence: "Public domain, non-commercial reuse (Gallica terms)"
  - id: grandville-word-machine
    on: [essay, original]
    file: ./images/grandville-word-machine.webp
    alt: "Engraving of a machine: word-blocks reading RIEN and GLOIRE turn on rods driven by spiked wheels, gears and a crank."
    asset: "The word machine, Voyages de Gulliver (1838)"
    author: "J. J. Grandville"
    source: "Source gallica.bnf.fr / BnF"
    url: "https://gallica.bnf.fr/ark:/12148/btv1b86002890/f78.item"
    licence: "Public domain, non-commercial reuse (Gallica terms)"
  # The Engine as black ink on a transparent ground (prepared from the-engine.png), for the
  # home page card: no white backdrop shows while it grows into the page's texture.
  - id: engine-ink
    on: [demo]
    file: ./images/engine-ink.png
    alt: "Diagram of the Lagado engine: a square frame of word-blocks with crank handles all around its edges."
    asset: "The Engine, from Gulliver's Travels, Part III (ink on a transparent ground)"
    source: "Wikimedia Commons"
    url: "https://commons.wikimedia.org/wiki/File:The_Engine_(Gulliver).png"
    licence: "Public domain"
  # The text on the "The original" page (original.mdx). Edition read on Wikisource, 2026-11-11.
  - id: swift-text
    on: [original]
    asset: "Gulliver’s Travels, Part III, Chapter 5, in The Works of the Rev. Jonathan Swift, Vol. 6, ed. John Nichols (1801)"
    author: "Jonathan Swift"
    source: "Wikisource"
    url: "https://en.wikisource.org/wiki/The_Works_of_the_Rev._Jonathan_Swift/Volume_6/A_Voyage_to_Laputa/Chapter_5"
    licence: "Public domain"
  # Sounds (src/demos/lagado/sounds/): each cut to one hit, softened (high frequencies rolled off,
  # a little low warmth) and levelled to the rattle; saved as .m4a, with a .wav fallback.
  # Licences read on each source page (OpenGameArt's licence field and the pack's licence file;
  # Freesound's licence box), 2026-11-11. Chosen by the author by ear (Checkpoint E).
  - id: sound-crank
    on: [demo]
    sound: crank
    asset: "One die clicking (die-throw-1, trimmed and softened), from Casino Audio"
    author: "Kenney (kenney.nl)"
    source: "OpenGameArt"
    url: "https://opengameart.org/content/54-casino-sound-effects-cards-dice-chips"
    licence: "CC0"
  - id: sound-shake
    on: [demo]
    sound: shake
    asset: "Dice shaken in a cup (dice-shake-1, trimmed and softened), from Casino Audio"
    author: "Kenney (kenney.nl)"
    source: "OpenGameArt"
    url: "https://opengameart.org/content/54-casino-sound-effects-cards-dice-chips"
    licence: "CC0"
  - id: sound-keep
    on: [demo]
    sound: keep
    asset: "Traditional stamp (trimmed and softened)"
    author: "I.fekry"
    source: "Freesound"
    url: "https://freesound.org/people/I.fekry/sounds/470710/"
    licence: "CC0"
  # The link-preview image (1200 × 627), made from design/previews/previews.html (ADR 007).
  # Chosen by the author on 2026-11-13; uses her drawing of Swift with her agreement.
  - id: lagado-preview
    on: [demo, essay, original, making-of]
    file: ./images/preview.png
    alt: "The Lagado Engine. Write any book. No genius. No study. Just turn the cranks. Beside it, an ink drawing of Jonathan Swift on a cream plate."
    asset: "Link-preview image, with the ink drawing of Jonathan Swift"
    author: "Amélie Derome"
    source: "The author"
    licence: "All rights reserved"
texture: the-engine
card: engine-ink
preview: lagado-preview
hero: swift-portrait
sticker: In beta since 1726
# Parody banner under the machine (chosen by the operator from machine-content.md, 2026-11-11).
banner:
  - Trained on all the words of the language
  - "Human in the loop: 36 readers, 4 scribes"
  - "Now hiring: 40 pupils, six hours a day"
  - Shipping broken sentences in large folio since 1726
  - Disrupting the Royal Society since 1726
  - Sole inventor. Rivals in Europe welcome to steal
  - Hallucinations, hand-bound
  - Founded in Lagado. Funded by nobody, yet
research:
  title: "Totalité et infini de la machine à tout dire de Gulliver's Travels : du programme littéraire au programme informatique"
  journal: "XVII-XVIII"
  issue: "77"
  year: 2020
  url: "https://journals.openedition.org/1718/5936"
  doi: "10.4000/1718.5936"
  language: "French"
