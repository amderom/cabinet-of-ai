title: Llull's Ars Magna
tagline: Placeholder tagline.
accent: "#FF2D55"
status: open
order: 2
# Ars generalis ultima, written 1305-1308; Ars brevis, Pisa 1308 (SEP, "Ramon Llull"). Chosen by the author.
year: "1308"
# Every image is declared once here and placed elsewhere by its id (ADR 005).
# Sources and licences: docs/features/llull/engravings.md. Prepared with docs/features/llull/prepare-images.cjs.
credits:
  # The fourth figure (the three wheels), black ink on white, for the background texture.
  - id: quarta-figura
    on: [demo, essay, original, making-of]
    file: ./images/quarta-figura.png
    alt: "Llull's fourth figure: three concentric paper wheels, each ringed with the letters B to K."
    asset: "Quarta figura, Ars magna generalis et ultima (Lyon, 1517), woodcut, colour removed"
    author: "Ramon Llull"
    source: "Getty Research Institute, via the Internet Archive"
    url: "https://archive.org/details/illuminatisacrep00llul/page/n39/mode/1up"
    licence: "Public domain"
  # The same figure as black ink on a transparent ground: the home card and plate I.
  - id: quarta-figura-ink
    on: [demo]
    file: ./images/quarta-figura-ink.png
    alt: "Llull's fourth figure: three concentric paper wheels, each ringed with the letters B to K."
    asset: "Quarta figura, Ars magna generalis et ultima (Lyon, 1517), ink on a transparent ground"
    author: "Ramon Llull"
    source: "Getty Research Institute, via the Internet Archive"
    url: "https://archive.org/details/illuminatisacrep00llul/page/n39/mode/1up"
    licence: "Public domain"
  # The author's drawing as ink on a transparent ground: plate II.
  - id: llull-portrait
    on: [demo]
    file: ./images/llull-portrait-ink.png
    alt: "Ink drawing of Ramon Llull in a fur-trimmed hat, with a long beard, a banderole unfurling from his mouth."
    asset: "Ramon Llull, ink drawing"
    author: "Amélie Derome"
    source: "The author"
    licence: "All rights reserved"
  # Llull's own words in the machine's answers and reasons (src/demos/llull/questions.ts): short
  # quotations, credited (the author's decision, 2026-11-13; SPEC.md). Checked word for word by script.
  - id: dambergs-translation
    on: [demo]
    asset: "Ramon Llull, Ars generalis ultima (1305–1308), English translation, quoted in the answers"
    author: "Yanis Dambergs (translator)"
    source: "lullianarts.net"
    url: "https://lullianarts.narpan.net/Ars-Magna/contents2.html"
    licence: "© 2003 Yanis Dambergs, short quotations"
  # Essay engravings, chosen by the author (2026-11-13). Cropped to the figure, in black and white;
  # prepared with docs/features/llull/prepare-essay-images.cjs.
  - id: breviculum
    on: [essay]
    file: ./images/breviculum.jpg
    alt: "Medieval miniature: Llull, in a brown habit, points from a ladder of being toward a tower of falsity stormed by figures on ropes; scholars sit in a column down the left."
    asset: "Llull and the ladder of being, Breviculum ex artibus Raimundi Lulli electum (c. 1321–1336), Cod. St. Peter perg. 92, in black and white (modern numerals of the reproduction removed)"
    author: "Thomas Le Myésier"
    source: "Badische Landesbibliothek Karlsruhe, via Wikimedia Commons"
    url: "https://commons.wikimedia.org/wiki/File:Ars_Magna_de_Ramon_Llull.jpg"
    licence: "Public domain"
  - id: prima-figura
    on: [essay]
    file: ./images/prima-figura.jpg
    alt: "Llull's first figure: the nine letters B to K around a circle, each joined to every other by straight lines, A at the centre."
    asset: "Prima figura, Ars magna generalis et ultima (Lyon, 1517), woodcut, colour removed"
    author: "Ramon Llull"
    source: "Getty Research Institute, via the Internet Archive"
    url: "https://archive.org/details/illuminatisacrep00llul/page/n33/mode/1up"
    licence: "Public domain"
  - id: secunda-figura
    on: [essay]
    file: ./images/secunda-figura.jpg
    alt: "Llull's second figure: a large T at the centre of three coloured triangles inside a lettered circle, with a reader's handwritten notes around it."
    asset: "Secunda figura, Ars magna generalis et ultima (Lyon, 1517), woodcut, colour removed, with a reader's notes"
    author: "Ramon Llull"
    source: "Getty Research Institute, via the Internet Archive"
    url: "https://archive.org/details/illuminatisacrep00llul/page/n35/mode/1up"
    licence: "Public domain"
  - id: tertia-figura
    on: [essay]
    file: ./images/tertia-figura.jpg
    alt: "Llull's third figure: a stepped table of every pair of letters, from BC to IK, thirty-six chambers."
    asset: "Tertia figura, Ars magna generalis et ultima (Lyon, 1517), woodcut"
    author: "Ramon Llull"
    source: "Getty Research Institute, via the Internet Archive"
    url: "https://archive.org/details/illuminatisacrep00llul/page/n38/mode/1up"
    licence: "Public domain"
